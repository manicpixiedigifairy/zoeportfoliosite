<!-- Zoë Austin portfolio loader.
     Paste into a Readymag Code widget (Widget Code, Use iFrame off) or a Squarespace Code block.
     It pulls the newest commit of the site straight from GitHub, so every push shows up
     here without touching the site builder. Links between the home page and the
     Password Protected case study stay inside the frame.
     Order it tries: newest commit via jsDelivr, then the main branch via jsDelivr, then the Netlify site. -->
<div style="position:fixed;inset:0;z-index:2147483000;background:#0B090A">
  <iframe id="za-portfolio"
          title="Zoë Austin Portfolio"
          style="display:block;width:100%;height:100%;border:0"
          allow="fullscreen"></iframe>
</div>
<script>
(function () {
  var REPO = 'manicpixiedigifairy/zoeportfoliosite';
  var NETLIFY_URL = 'https://zoeportfoliosite.netlify.app/';
  var frame = document.getElementById('za-portfolio');
  if (!frame) return;
  var root = '', pendingHash = '';

  function show(path, html) {
    /* point relative paths (assets/..., password-protected/...) at the same commit */
    var dir = path.lastIndexOf('/') > -1 ? path.slice(0, path.lastIndexOf('/') + 1) : '';
    var tag = '<base href="' + root + dir + '">';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
    frame.srcdoc = html;
  }
  function open(path, hash) {
    pendingHash = hash || '';
    return fetch(root + path, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('jsDelivr ' + r.status);
      return r.text();
    }).then(function (html) { show(path, html); });
  }
  function start(ref) {
    root = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + ref + '/';
    return open('index.html');
  }

  /* keep page-to-page links (home, case study, back) inside the frame */
  frame.addEventListener('load', function () {
    var d;
    try { d = frame.contentDocument; } catch (e) { return; }
    if (!d || !root) return;
    if (pendingHash) { var t = d.getElementById(pendingHash); if (t) t.scrollIntoView(); pendingHash = ''; }
    d.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || a.target === '_blank') return;
      var raw = a.getAttribute('href');
      if (!raw || raw.charAt(0) === '#') return;
      var url = a.href, hash = '', i = url.indexOf('#');
      if (i > -1) { hash = url.slice(i + 1); url = url.slice(0, i); }
      if (url.indexOf(root) !== 0) return;
      var path = url.slice(root.length);
      if (path === '' || path.charAt(path.length - 1) === '/') path += 'index.html';
      if (!/\.html$/.test(path)) return;
      e.preventDefault();
      e.stopPropagation();
      open(path, hash).catch(function () { frame.src = NETLIFY_URL + path.replace(/index\.html$/, ''); });
    }, true);
  });

  fetch('https://api.github.com/repos/' + REPO + '/commits/main', { headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
    .then(function (c) { return start(c.sha); })
    .catch(function () { return start('main'); })
    .catch(function () { frame.src = NETLIFY_URL + '?v=' + Date.now(); });
})();
</script>
